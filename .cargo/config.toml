[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
runner = "tools/run-qemu.sh"
rustflags = ["-C", "link-arg=-Tkernel/src/arch/aarch64/linker.ld"]

[target.riscv64gc-unknown-none-elf]
runner = "tools/run-qemu-riscv.sh"
# #228 debug: force frame pointers so write_saved_sp can walk the
# kstack call chain via the s0/fp register chain and validate
# every saved-ra slot up the chain.
rustflags = [
    "-C", "link-arg=-Tkernel/src/arch/riscv64/linker.ld",
    "-C", "force-frame-pointers=yes",
]

[target.x86_64-unknown-none]
runner = "tools/run-qemu-x86.sh"
# #208/#233 debug: force frame pointers so write_saved_sp can walk the
# kstack call chain via the rbp chain and validate every saved-ra slot,
# and so the #PF RBP backtrace (exception.rs) produces real chains.
rustflags = ["-C", "link-arg=-Tkernel/src/arch/x86_64/linker.ld", "-C", "code-model=kernel", "-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]

[target.loongarch64-unknown-none]
runner = "tools/run-qemu-loongarch64.sh"
rustflags = ["-C", "link-arg=-Tkernel/src/arch/loongarch64/linker.ld"]

[target.mips64el-telix-none]
runner = "tools/run-qemu-mips64.sh"
rustflags = ["-C", "link-arg=-Tkernel/src/arch/mips64/linker.ld"]

[target.mips64-telix-none]
runner = "tools/run-qemu-mips64-be.sh"
rustflags = ["-C", "link-arg=-Tkernel/src/arch/mips64/linker.ld"]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
