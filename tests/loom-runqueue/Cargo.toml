[package]
name = "loom-runqueue"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone (excluded from the kernel workspace) for the same reason as
# tests/loom-park-state: loom needs std/Arc; the kernel is no_std.
#
# We model the per-thread `in_queue` AtomicBool protocol from
# kernel/src/sched/scheduler.rs:
#
#   * percpu_enqueue early-exit:
#       if in_queue.swap(true) { return; }   // already enqueued
#       heap.push(tid)
#
#   * percpu_pick_next dispatch:
#       tid = heap.pop()
#       in_queue.store(false)
#
#   * rescue_orphaned_threads phantom-heal:
#       if in_queue && !heap.contains(tid) {
#           in_queue.store(false)
#           percpu_enqueue(tid)              // -> swap(true) + heap.push
#       }
#
# The invariant we assert at every quiescent point:
#
#       in_queue == (heap_member > 0)
#
# i.e. no phantom (in_queue=true with heap empty) and no double-enq
# (heap_member > 1).

[dependencies]
loom = "0.7"

[profile.release]
debug = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(loom)'] }
